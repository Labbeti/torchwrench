[project]
name = "torchwrench"
authors = [
    {name = "Étienne Labbé (Labbeti)", email = "labbeti.pub@gmail.com"},
]
description = "Collection of functions and modules to help development in PyTorch."
readme = "README.md"
requires-python = ">=3.8,<3.15"
keywords = ["pytorch", "deep-learning"]
license = {file = "LICENSE"}
# license-files = ["LICENSE"]  # unsupported by python 3.8, but will be required in 2026
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
]
maintainers = [
    {name = "Étienne Labbé (Labbeti)", email = "labbeti.pub@gmail.com"},
]
dynamic = ["version"]
dependencies = [
    "lazy-loader>=0.4,<1",
    "pythonwrench>=0.6.2,<0.7.0",
    "torch>=1.10.0",
    "typing-extensions>=4.10.0",
    # >= 61 for build backend
    # < 82 for pkg_resources for older pkgs versions (tensorboard)
    "setuptools>=61.0,<82.0.0",
]

[project.urls]
Homepage = "https://pypi.org/project/torchwrench/"
Documentation = "https://torchwrench.readthedocs.io/"
Repository = "https://github.com/Labbeti/torchwrench.git"
Changelog = "https://github.com/Labbeti/torchwrench/blob/main/CHANGELOG.md"
Tracker = "https://github.com/Labbeti/torchwrench/issues"

[project.scripts]
torchwrench-info = "torchwrench.entrypoints.info:main_info"
tow-info = "torchwrench.entrypoints.info:main_info"
tw-info = "torchwrench.entrypoints.info:main_info"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", '**/node_modules', '**/.*', '.venv']
pythonVersion = "3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.uv.sources]
torchwrench = { workspace = true }

[tool.uv]
conflicts = []

[dependency-groups]
dev = [
    "torchwrench[dev]",
]
extras = [
    "torchwrench[extras]",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.12.3",
    "pre-commit>=3.5.0",
    "twine>=6.1,<7; python_version < '3.10'",
    "twine>=7; python_version >= '3.10'",
    "torchwrench[docs]",
    "torchwrench[numpy]",
    "torchwrench[tests]",
]
tests = [
    "ruff==0.16.10",
    "coverage[toml]>=7.6.1",
    "pytest>=8.3.5",
    "torchvision>=0.11.1",
]
docs = [
    "sphinx>=7.1.2,<9.0.0",
    "sphinx-immaterial>=0.11.14",
]
extras = [
    "torchwrench[numpy]",
    "torchwrench[colorlog]",
    "torchwrench[h5py]",
    "torchwrench[omegaconf]",
    "torchwrench[pandas]",
    "torchwrench[yaml]",
    "torchwrench[safetensors]",
    "torchwrench[tensorboard]",
    "torchwrench[torchaudio]",
]
colorlog = [
    "colorlog>=6.12.0",
]
h5py = [
    "h5py>=3.11.0",
    "torchwrench[numpy]",
    "tqdm>=4.69.0",
]
numpy = [
    "numpy!=2.0.0,!=2.0.1,!=2.0.2",
]
omegaconf = [
    "omegaconf>=2.3.1",
]
pandas = [
    "pandas>=2.0.3",
]
yaml = [
    "pyyaml>=6.0.3",
]
safetensors = [
    "safetensors>=0.5.3",
]
tensorboard = [
    "tensorboard>=2.14.0",
]
torchaudio = [
    "soundfile>=0.13.1",
    "torchaudio>=0.10.0",
    "torchcodec>=0.15.0 ; python_full_version >= '3.10' and sys_platform != 'darwin'",
]
speechbrain = [
    "speechbrain~=1.0.3",
    "torchaudio<2.9,>=0.10.0",
]

# --- Build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This tells Hatch to find 'chicasr' inside the 'src' directory
packages = ["src/torchwrench"]

[tool.hatch.build.targets.wheel.sources]
# Ensure the 'src' directory itself is treated as the root
"src" = ""

[tool.hatch.version]
path = "src/torchwrench/__init__.py"

[tool.ruff]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["notebooks/**.ipynb"]

[tool.ruff.lint.per-file-ignores]
# F401   : unused imports
# E402   : module import not at top of file
# UP009  : remove unnecessary utf-8 coding
# EXE001 : specify sheshang but file is not executable
# PYI061 : replace Literal[None, ...] by Literal[...] | None
# FA100  : Add `from __future__ import annotations` to simplify `typing.Dict`
# PLC0105: `TypeVar` name "T_BuiltinScalar" does not reflect its covariance; consider renaming it to "T_BuiltinScalar_co"
# PYI059 : `Generic[]` should always be the last base class
"__init__.py" = ["F401"]
"notebooks/**.ipynb" = ["E402"]
"*.py" = ["UP009", "EXE001", "PYI061", "FA100", "PLC0105", "PYI059"]
