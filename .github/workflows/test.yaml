# Template: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package using Pip

on:
  push:
    branches: [ main, dev** ]
  pull_request:
    branches: [ main, dev** ]

env:
  CACHE_NUMBER: 0  # increase to reset cache manually
  UV_NO_SYNC: 1
  TORCHWRENCH_TMPDIR: "./tmp"

# Cancel workflow if a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-extras:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
            torch-version: "1.10"
          - os: ubuntu-latest
            python-version: "3.14"
            torch-version: "torch-latest"
          - os: windows-2022
            python-version: "3.8"
            torch-version: "1.10"
          - os: windows-latest
            python-version: "3.14"
            torch-version: "torch-latest"
          - os: macos-15
            python-version: "3.8"
            torch-version: "2.0"
          - os: macos-latest
            python-version: "3.14"
            torch-version: "torch-latest"

    steps:
    # --- INSTALLATIONS ---
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv and set Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install package
      if: matrix.torch-version == 'torch-latest'
      shell: bash
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install .[tests,extras]

    - name: Install package with PyTorch ${{ matrix.torch-version }}
      if: matrix.torch-version != 'torch-latest'
      shell: bash
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install torch==${{ matrix.torch-version }} -e .[tests,extras]

    - name: Additional install soundfile (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install libsndfile1

    - name: Additional install soundfile (macOS)
      if: matrix.os == 'macos-latest' || matrix.os == 'macos-15'
      run: |
        brew install libsndfile

    # Linux
    - name: Install FFmpeg on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes ffmpeg

    # macOS
    - name: Install FFmpeg on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ffmpeg

        # Help native extensions find Homebrew libraries.
        echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
        echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix ffmpeg)/lib" >> "$GITHUB_ENV"

    # Windows: TorchCodec needs a shared FFmpeg build, not only ffmpeg.exe.
    - name: Install shared FFmpeg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $version = "7.1.1"
        $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
        $installDir = Join-Path $env:RUNNER_TEMP "ffmpeg"

        # Use a full shared build containing avcodec/avformat DLLs.
        $url = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-full_build-shared.zip"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $archive

        Expand-Archive `
          -Path $archive `
          -DestinationPath $installDir

        $bin = Get-ChildItem `
          -Path $installDir `
          -Directory `
          -Recurse |
          Where-Object {
            Test-Path (Join-Path $_.FullName "ffmpeg.exe")
          } |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $bin) {
          throw "Could not locate the extracted FFmpeg bin directory."
        }

        $bin | Out-File `
          -FilePath $env:GITHUB_PATH `
          -Encoding utf8 `
          -Append

        "FFMPEG_BIN=$bin" | Out-File `
          -FilePath $env:GITHUB_ENV `
          -Encoding utf8 `
          -Append

    # --- TESTS ---
    - name: Verify FFmpeg
      run: |
        ffmpeg -version

    - name: Print install info
      run: |
        uv run torchwrench-info

    - name: Check format with Ruff
      run: |
        uv run ruff check

    - name: Test with pytest
      run: |
        uv run coverage run -m pytest -v

    - name: Show coverage results
      run: |
        uv run coverage report -m

  build-minimal:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        torch-version: ["torch-latest"]
        include:
          - os: windows-2022
            python-version: "3.8"
            torch-version: "1.10"
          - os: windows-latest
            python-version: "3.14"
            torch-version: "torch-latest"
          - os: macos-15
            python-version: "3.9"
            torch-version: "1.10"
          - os: macos-latest
            python-version: "3.14"
            torch-version: "torch-latest"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "1.10"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "1.11"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "1.12"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "1.13"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "2.0"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "2.1"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "2.2"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "2.3"
          - os: ubuntu-24.04
            python-version: "3.8"
            torch-version: "2.4"
            # note: torch 2.5 is not available for python<=3.8
          - os: ubuntu-24.04
            python-version: "3.9"
            torch-version: "2.5"
          - os: ubuntu-24.04
            python-version: "3.9"
            torch-version: "2.6"
          - os: ubuntu-24.04
            python-version: "3.9"
            torch-version: "2.7"
          - os: ubuntu-24.04
            python-version: "3.9"
            torch-version: "2.8"
          - os: ubuntu-24.04
            python-version: "3.10"
            torch-version: "2.9"
          - os: ubuntu-24.04
            python-version: "3.10"
            torch-version: "2.10"
          - os: ubuntu-24.04
            python-version: "3.10"
            torch-version: "2.11"
          - os: ubuntu-24.04
            python-version: "3.10"
            torch-version: "2.12"
          - os: ubuntu-24.04
            python-version: "3.10"
            torch-version: "2.13"

    steps:
    # --- INSTALLATIONS ---
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv and set Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install package
      if: matrix.torch-version == 'torch-latest'
      shell: bash
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install .[tests]

    - name: Install package with PyTorch ${{ matrix.torch-version }}
      if: matrix.torch-version != 'torch-latest'
      shell: bash
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install torch==${{ matrix.torch-version }} -e .[tests]

    - name: Additional install soundfile (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install libsndfile1

    - name: Additional install soundfile (macOS)
      if: matrix.os == 'macos-latest' || matrix.os == 'macos-15'
      run: |
        brew install libsndfile

    # --- TESTS ---
    - name: Print install info
      run: |
        uv run torchwrench-info

    - name: Check format with Ruff
      run: |
        uv run ruff check

    - name: Test with coverage + pytest
      run: |
        uv run coverage run --debug=trace -m pytest -v '--ignore-glob=tests/**test_extras*.py'

    - name: Show coverage results
      run: |
        uv run coverage report -m
